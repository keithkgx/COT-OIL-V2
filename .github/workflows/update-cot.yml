name: Update COT and Dashboard

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/update-cot.yml'
      - 'oil-positioning-intelligence/src/**'
      - 'oil-positioning-intelligence/templates/**'
      - 'oil-positioning-intelligence/tests/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-cot.yml'
      - 'oil-positioning-intelligence/src/**'
      - 'oil-positioning-intelligence/templates/**'
      - 'oil-positioning-intelligence/tests/**'
      - 'oil-positioning-intelligence/requirements.txt'
  schedule:
    # 06:37 and 12:37 Singapore time
    - cron: '37 6,12 * * *'
      timezone: 'Asia/Singapore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Keep preview jobs from canceling a production refresh or Pages deployment.
  group: ${{ github.event_name == 'pull_request' && format('oil-cot-pr-{0}', github.event.pull_request.number) || 'oil-cot-update' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: oil-positioning-intelligence

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: oil-positioning-intelligence/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Validate embedded dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('templates/dashboard.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          assert blocks and 'const DATA=__EMBEDDED_DATA__' in blocks[-1]
          Path('/tmp/oilcot-dashboard.js').write_text(blocks[-1], encoding='utf-8')
          PY
          node --check /tmp/oilcot-dashboard.js

      - name: Build dashboard preview from the committed historical data
        if: github.event_name == 'pull_request'
        env:
          PYTHONPATH: src
        run: |
          python -m oilcot.cli build
          python - <<'PY'
          from pathlib import Path
          page = Path('dashboard/index.html')
          assert page.exists() and page.stat().st_size > 100_000
          text = page.read_text(encoding='utf-8')
          for needle in ('id="asof"', 'id="kpis"', 'id="flows-chart"', 'id="overview-chart"'):
              assert needle in text, needle
          print(f'Dashboard preview generated: {page.stat().st_size:,} bytes')
          PY

      - name: Upload reviewable HTML dashboard
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: oil-cot-dashboard-preview
          path: oil-positioning-intelligence/dashboard/index.html
          retention-days: 7

      - name: Build dashboard from saved CFTC history on code changes
        if: github.event_name == 'push'
        env:
          PYTHONPATH: src
        run: python -m oilcot.cli build

      - name: Install Playwright Chromium for visual sizing smoke test
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install chromium

      - name: Test chart rendering, date alignment and downloads
        if: github.event_name == 'pull_request'
        env:
          PYTHONPATH: src
        run: python tests/browser_smoke.py

      - name: Upload browser screenshots
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: oil-cot-browser-smoke-screenshots
          path: oil-positioning-intelligence/browser-test-output
          if-no-files-found: ignore
          retention-days: 7

      - name: Fetch official CFTC data and rebuild dashboard
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          PYTHONPATH: src
          CFTC_APP_TOKEN: ${{ secrets.CFTC_APP_TOKEN }}
        run: python -m oilcot.cli refresh

      - name: Commit updated observations and dashboard
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cot_history.csv dashboard/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh official CFTC COT observations'
            git push
          else
            echo 'No updated observations; nothing to commit.'
          fi

  pages_status:
    name: Check public Pages availability
    needs: update
    if: ${{ github.event_name != 'pull_request' && vars.PUBLISH_PAGES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.inspect.outputs.enabled }}
    steps:
      - name: Verify GitHub Pages is enabled and uses Actions
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if mode="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type // ""' 2>/dev/null)"; then
            if [ "$mode" = "workflow" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "GitHub Pages is enabled with GitHub Actions publishing."
            else
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::warning::GitHub Pages exists but its publishing source is not GitHub Actions. Open Settings > Pages and select GitHub Actions."
              echo "GitHub Pages publishing needs Source: GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled or is unavailable on this repository's plan. The CFTC update succeeded; public publishing was safely skipped."
            echo "GitHub Pages is not enabled or is inaccessible. Configure Settings > Pages > Source: GitHub Actions. For private repositories, an eligible GitHub plan is needed; otherwise use a separate public site repository." >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Publish public dashboard (when Pages is ready)
    needs: [update, pages_status]
    if: ${{ github.event_name != 'pull_request' && needs.pages_status.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main data and dashboard
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public dashboard only
        uses: actions/upload-pages-artifact@v4
        with:
          path: oil-positioning-intelligence/dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
